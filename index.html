<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Login - SimpleLogin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-4">
                <h1 class="login-title">SimpleLogin</h1>
                <p class="text-muted">Hesabınıza giriş yapın</p>
            </div>

            <form id="loginForm" class="needs-validation" novalidate>
                <!-- Email Input -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-posta Adresi</label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        name="email"
                        placeholder="ornek@example.com"
                        required
                    >
                    <div class="invalid-feedback" id="emailFeedback">
                        Lütfen geçerli bir e-posta adresi girin.
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-3">
                    <label for="password" class="form-label">Şifre</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password"
                        placeholder="Şifrenizi girin"
                        required
                        minlength="6"
                    >
                    <div class="invalid-feedback" id="passwordFeedback">
                        Şifre en az 6 karakter olmalıdır.
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="mb-3 form-check">
                    <input 
                        type="checkbox" 
                        class="form-check-input" 
                        id="rememberMe" 
                        name="rememberMe"
                    >
                    <label class="form-check-label" for="rememberMe">
                        Beni hatırla
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Giriş Yap
                </button>

                <!-- Success Message -->
                <div id="successMessage" class="alert alert-success d-none" role="alert">
                    Başarıyla giriş yaptınız!
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
            </form>

            <!-- Footer -->
            <div class="text-center mt-4">
                <p class="text-muted small">
                    <a href="#" class="text-decoration-none">Şifremi unuttum</a> | 
                    <a href="#" class="text-decoration-none">Kaydol</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
